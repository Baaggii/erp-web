# .github/workflows/deploy.yml
name: Deploy to VPS

on:
  push:
  branches: [ master ]           # эсвэл main / feature/login-ui

jobs:
  deploy:
  runs-on: ubuntu-latest

  steps:
  - name: SSH & deploy
  uses: appleboy/ssh-action@v1
  with:
  host:     ${{ secrets.SSH_HOST }}
  username: ${{ secrets.SSH_USER }}
  key:      ${{ secrets.SSH_KEY }}
  script: |
  export NODE_OPTIONS=--openssl-legacy-provider
  cd ~/apps/erp-web
  git pull origin master
  npm install --omit=dev           # lock файлтай үед npm ci
  npm run build
  pm2 reload erp-web               # анхны удаад serve -f